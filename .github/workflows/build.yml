name: Build Web App

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend logic
        run: npm run test:unit
      - name: Build web app
        run: npm run build
      - name: Install backend dependencies
        run: npm --prefix server ci
      - name: Test backend logic
        run: npm --prefix server test
